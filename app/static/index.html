<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BSEHons Policy Search</title>
<style>
  :root {
    --bg: #f6f5f2; --surface: #ffffff; --text: #1c1b19; --muted: #6b6860;
    --line: #e2dfd8; --accent: #8a1c2b; --accent-soft: #f6e6e8; --ok: #1f6f4a; --ok-soft: #e1f2e9;
    --mark: #fbe9a6;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #151413; --surface: #1f1e1c; --text: #ecebe7; --muted: #9a968d;
      --line: #35332f; --accent: #e07a88; --accent-soft: #3a2125; --ok: #6fcf9b; --ok-soft: #1d3328;
      --mark: #5a4b12;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .wrap { max-width: 820px; margin: 0 auto; padding: 28px 16px 64px; }
  h1 { font-size: 1.5rem; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 20px; font-size: .95rem; }
  .box { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px; }
  .row { display: flex; gap: 8px; }
  input[type=text] { flex: 1; min-width: 0; font: inherit; color: var(--text); background: var(--bg);
    border: 1px solid var(--line); border-radius: 8px; padding: 11px 12px; }
  input[type=text]:focus, select:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  button.go { font: inherit; font-weight: 600; background: var(--accent); color: #fff; border: 0;
    border-radius: 8px; padding: 0 20px; cursor: pointer; }
  button.go:disabled { opacity: .6; cursor: wait; }
  .filters { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 12px; font-size: .88rem; color: var(--muted); }
  .filters label { display: flex; align-items: center; gap: 6px; }
  select { font: inherit; font-size: .88rem; color: var(--text); background: var(--bg);
    border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 14px 0 4px; }
  .chip { font: inherit; font-size: .84rem; color: var(--text); background: var(--surface);
    border: 1px solid var(--line); border-radius: 999px; padding: 4px 11px; cursor: pointer; }
  .chip:hover { border-color: var(--accent); color: var(--accent); }
  .meta { margin: 18px 2px 8px; color: var(--muted); font-size: .85rem; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
    padding: 14px 16px; margin-bottom: 10px; }
  .card.top { border-color: var(--accent); }
  .head { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; margin-bottom: 6px; }
  .rank { font-weight: 700; color: var(--accent); }
  .title { font-weight: 600; }
  .page { color: var(--muted); font-size: .85rem; margin-left: auto; }
  .badges { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
  .badge { font-size: .74rem; padding: 2px 8px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); }
  .badge.kw { background: var(--ok-soft); color: var(--ok); }
  .badge.plain { background: var(--bg); color: var(--muted); border: 1px solid var(--line); }
  .text { margin: 0; white-space: pre-wrap; }
  mark { background: var(--mark); color: inherit; border-radius: 3px; padding: 0 1px; }
  .empty, .err { text-align: center; color: var(--muted); padding: 28px 8px; }
  .err { color: var(--accent); }
  details { margin-top: 8px; font-size: .8rem; color: var(--muted); }
  code { font-size: .78rem; }
</style>
</head>
<body>
<div class="wrap">
  <h1>BSEHons Policy Search</h1>
  <p class="sub">Ask a question about the 2025/2026 student guidebook. <span id="status">Connecting…</span></p>

  <div class="box">
    <form id="form" class="row">
      <input type="text" id="q" placeholder="e.g. Can I drop a course after the drop date?" autocomplete="off" autofocus>
      <button class="go" id="go" type="submit">Search</button>
    </form>
    <div class="filters">
      <label>Who are you
        <select id="audience">
          <option value="">Anyone</option>
          <option value="applicant">Applicant</option>
          <option value="new_student">New student</option>
          <option value="student">Current student</option>
        </select>
      </label>
      <label>Topic
        <select id="topic"><option value="">All topics</option></select>
      </label>
      <label>Results
        <select id="topk">
          <option>3</option><option selected>5</option><option>8</option><option>10</option>
        </select>
      </label>
    </div>
  </div>

  <div class="chips" id="chips"></div>
  <div class="meta" id="meta"></div>
  <div id="results"></div>
</div>

<script>
const EXAMPLES = [
  "What are the entry requirements?",
  "Can I drop a course after the drop date and get a refund?",
  "Prerequisites for EEI5467",
  "What marks do I need to sit the final exam?",
  "What GPA do I need for first class?",
  "Does my IELTS score exempt me from English?",
  "What degree do I get if I can't finish in 12 years?",
  "Is a late mini project report accepted?",
  "How much are the fees for first year?",
  "Do I need a laptop?"
];
const $ = id => document.getElementById(id);
const esc = s => s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function highlight(text, query) {
  const words = [...new Set(query.toLowerCase().match(/[a-z]+\d+|\d+(?:\.\d+)?|[a-z]{4,}/g) || [])];
  let html = esc(text);
  if (!words.length) return html;
  const re = new RegExp("\\b(" + words.map(w => w.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")).join("|") + ")", "gi");
  return html.replace(re, "<mark>$1</mark>");
}

function render(data, ms) {
  const box = $("results");
  if (!data.results.length) {
    $("meta").textContent = "";
    box.innerHTML = '<div class="empty">No matching rules found. Try rephrasing, or contact bseinfo@ousl.lk.</div>';
    return;
  }
  $("meta").textContent = `${data.results.length} passages · ${ms} ms · ${data.model.split("/").pop()}`;
  box.innerHTML = data.results.map((r, i) => `
    <div class="card ${i === 0 ? "top" : ""}">
      <div class="head">
        <span class="rank">#${i + 1}</span>
        <span class="title">${esc(r.section)}</span>
        <span class="page">Guidebook p. ${esc(r.page)}</span>
      </div>
      <div class="badges">
        <span class="badge">${esc(r.topic)}</span>
        ${r.keyword_match ? '<span class="badge kw">keyword match</span>' : ""}
        <span class="badge plain">meaning ${r.dense_score.toFixed(2)}</span>
        <span class="badge plain">${esc(r.applies_to.join(", "))}</span>
      </div>
      <p class="text">${highlight(r.text, $("q").value)}</p>
      <details><summary>Debug</summary><code>id: ${esc(r.id)} · fused score: ${r.score}</code></details>
    </div>`).join("");
}

async function search(query) {
  query = query.trim();
  if (query.length < 2) return;
  $("go").disabled = true;
  $("results").innerHTML = "";
  const body = { query, top_k: +$("topk").value };
  if ($("audience").value) body.audience = $("audience").value;
  if ($("topic").value) body.topic = $("topic").value;
  const t0 = performance.now();
  try {
    const res = await fetch("/search", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
    if (!res.ok) throw new Error((await res.json()).detail || res.statusText);
    render(await res.json(), Math.round(performance.now() - t0));
  } catch (e) {
    $("meta").textContent = "";
    $("results").innerHTML = `<div class="err">Search failed: ${esc(String(e.message || e))}</div>`;
  } finally {
    $("go").disabled = false;
  }
}

$("form").addEventListener("submit", e => { e.preventDefault(); search($("q").value); });
["audience", "topic", "topk"].forEach(id => $(id).addEventListener("change", () => search($("q").value)));

$("chips").innerHTML = EXAMPLES.map(t => `<button type="button" class="chip">${esc(t)}</button>`).join("");
$("chips").addEventListener("click", e => {
  if (e.target.classList.contains("chip")) { $("q").value = e.target.textContent; search($("q").value); }
});

(async () => {
  try {
    const [h, t] = await Promise.all([fetch("/health").then(r => r.json()), fetch("/topics").then(r => r.json())]);
    $("status").textContent = `${h.chunks} passages indexed.`;
    $("topic").insertAdjacentHTML("beforeend", t.topics.map(x => `<option value="${esc(x)}">${esc(x.replace(/_/g, " "))}</option>`).join(""));
  } catch { $("status").textContent = "API not reachable."; }
})();
</script>
</body>
</html>
